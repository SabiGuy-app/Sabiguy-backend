name: Backend CI/CD Pipeline
on:
  push:
    branches:
      - main
      - dev
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - dev

env:
  AWS_REGION: us-east-1
  CONTAINER_NAME: sabiguy-backend

jobs:
  check-dev-sync:
    # Skip this check if the PR is coming from a hotfix branch.
    # Hotfix branches are emergencies, they bypass dev and go straight to main.
    # Every other branch (feature, chore, etc.) still must come from dev.
    if: |
      github.event_name == 'pull_request' &&
      github.base_ref == 'main' &&
      !startsWith(github.head_ref, 'hotfix/')
    runs-on: ubuntu-latest
    steps:
      - name: Ensure PR is from dev branch only
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "Only the dev branch (or a hotfix/* branch) can be merged into main"
            exit 1
          fi

  build-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::914471710952:role/sabiguy-github-actions-backend
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.STAGING_ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::914471710952:role/sabiguy-github-actions-backend
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.PRODUCTION_ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build-staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Write env file to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ${{ secrets.STAGING_EC2_USERNAME }}
          key: ${{ secrets.STAGING_EC2_SSH_KEY }}
          script: |
            cat > /home/${{ secrets.STAGING_EC2_USERNAME }}/.env << ENVEOF
            PORT=3000
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            CLOUD_NAME=${{ secrets.CLOUD_NAME }}
            CLOUD_API_SECRET=${{ secrets.CLOUD_API_SECRET }}
            CLOUD_API_KEY=${{ secrets.CLOUD_API_KEY }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}
            BREVO_SENDER_EMAIL=${{ secrets.BREVO_SENDER_EMAIL }}
            FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}
            FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
            FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
            FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
            FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
            FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
            FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
            FIREBASE_SERVICE_ACCOUNT_KEY=${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
            PAYSTACK_SECRET_KEY=${{ secrets.PAYSTACK_SECRET_KEY }}
            PAYSTACK_PUBLIC_KEY=${{ secrets.PAYSTACK_PUBLIC_KEY }}
            MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            SABIGUY_LOGO_URL=${{ secrets.SABIGUY_LOGO_URL }}
            API_BASE_URL=${{ secrets.API_BASE_URL }}
            GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
            ENVEOF

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ${{ secrets.STAGING_EC2_USERNAME }}
          key: ${{ secrets.STAGING_EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 914471710952.dkr.ecr.us-east-1.amazonaws.com
            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true
            docker system prune -af
            docker pull ${{ secrets.STAGING_ECR_REPOSITORY }}:${{ github.sha }}
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart always \
              --log-driver awslogs \
              --log-opt awslogs-region=us-east-1 \
              --log-opt awslogs-group=/sabiguy/staging/app \
              --log-opt awslogs-stream=backend \
              -p 3000:3000 \
              --env-file /home/${{ secrets.STAGING_EC2_USERNAME }}/.env \
              ${{ secrets.STAGING_ECR_REPOSITORY }}:${{ github.sha }}

  deploy-production:
    needs: build-production
    if: vars.PRODUCTION_READY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Write env file to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_EC2_HOST }}
          username: ${{ secrets.PRODUCTION_EC2_USERNAME }}
          key: ${{ secrets.PRODUCTION_EC2_SSH_KEY }}
          script: |
            cat > /home/${{ secrets.PRODUCTION_EC2_USERNAME }}/.env << ENVEOF
            PORT=3000
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            CLOUD_NAME=${{ secrets.CLOUD_NAME }}
            CLOUD_API_SECRET=${{ secrets.CLOUD_API_SECRET }}
            CLOUD_API_KEY=${{ secrets.CLOUD_API_KEY }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}
            BREVO_SENDER_EMAIL=${{ secrets.BREVO_SENDER_EMAIL }}
            FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}
            FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
            FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
            FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
            FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
            FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
            FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
            FIREBASE_SERVICE_ACCOUNT_KEY=${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
            PAYSTACK_SECRET_KEY=${{ secrets.PAYSTACK_SECRET_KEY }}
            PAYSTACK_PUBLIC_KEY=${{ secrets.PAYSTACK_PUBLIC_KEY }}
            MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            SABIGUY_LOGO_URL=${{ secrets.SABIGUY_LOGO_URL }}
            API_BASE_URL=${{ secrets.API_BASE_URL }}
            GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
            ENVEOF

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_EC2_HOST }}
          username: ${{ secrets.PRODUCTION_EC2_USERNAME }}
          key: ${{ secrets.PRODUCTION_EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 914471710952.dkr.ecr.us-east-1.amazonaws.com
            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true
            docker system prune -af
            docker pull ${{ secrets.PRODUCTION_ECR_REPOSITORY }}:${{ github.sha }}
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart always \
              --log-driver awslogs \
              --log-opt awslogs-region=us-east-1 \
              --log-opt awslogs-group=/sabiguy/production/app \
              --log-opt awslogs-stream=backend \
              -p 3000:3000 \
              --env-file /home/${{ secrets.PRODUCTION_EC2_USERNAME }}/.env \
              ${{ secrets.PRODUCTION_ECR_REPOSITORY }}:${{ github.sha }}